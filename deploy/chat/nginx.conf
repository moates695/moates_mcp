# nginx reverse proxy for the moates web chat proxy.
# Place at /etc/nginx/sites-available/chat.moates.com.au and symlink into
# sites-enabled, then run certbot to add the TLS certificate:
#
#   sudo certbot --nginx -d chat.moates.com.au
#
# NOTE: if the droplet routes prod subdomains via a dockerised nginx-proxy
# (as the comments in the other compose files suggest), configure this vhost
# there the same way mcp.moates.com.au was set up, pointing at
# moates-chat-prod:8000. This file is the bare-metal reference.

server {
    listen 80;
    server_name chat.moates.com.au;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
