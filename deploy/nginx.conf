# nginx reverse proxy for the moates-mcp Streamable HTTP endpoint.
# Place at /etc/nginx/sites-available/mcp.moates.com.au and symlink into
# sites-enabled, then run certbot to add the TLS certificate.
#
#   sudo certbot --nginx -d mcp.moates.com.au

server {
    listen 80;
    server_name mcp.moates.com.au;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Streamable HTTP may use SSE for streamed responses: don't buffer,
        # keep the connection alive, and forward the upgrade headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
