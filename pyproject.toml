[project]
name = "moates-mcp"
version = "0.1.0"
description = "An MCP server that answers questions about Marcus Oates (projects and resume)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Capped below 2.0: that release moved FastMCP out of mcp.server.fastmcp, so
    # an unpinned rebuild resolves to an SDK this server cannot import.
    "mcp[cli]>=1.2.0,<2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
moates-mcp = "moates_mcp:main"

[project.optional-dependencies]
# Web chat proxy (moates_chat). Kept out of the base install so the MCP server
# image stays lean; the chat Docker image installs `.[chat]`.
chat = [
    "fastapi>=0.110.0",
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moates_mcp", "src/moates_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
