[project]
name = "moates-mcp"
version = "0.1.0"
description = "An MCP server that answers questions about Marcus Oates (projects and resume)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
moates-mcp = "moates_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moates_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
